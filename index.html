  // HỆ THỐNG ÂM THANH CLICK TO RÕ, SẮC NÉT
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function playClick() {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(850, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.06);
      
      gain.gain.setValueAtTime(0.75, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    } catch (e) {}
  }

  function playSubmitSound() {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.6, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.25);
      });
    } catch (e) {}
  }

    { q: "Câu 34. Một chuỗi những phản ứng của động vật trả lời kích thích từ môi trường, đảm bảo cho động vật tồn tại và phát triển gọi là:", o: ["A. tập nhiễm", "B. tập hợp", "C. tập kết", "D. tập tính"], a: 3 },
    { q: "Câu 35. Mèo bắt chuột thường rình mồi, vồ mồi, vờn mồi nhằm:", o: ["A. nâng cao hiệu suất săn mồi của mèo", "B. thu hút bạn tình giữa mèo và chuột", "C. tránh rét vào mùa đông", "D. Bảo vệ được nguồn thức ăn"], a: 0 },
    { q: "Câu 36. Trâu rừng thường sống theo đàn nhằm:", o: ["A. hỗ trợ nhau", "B. tranh giành thức ăn", "C. cạnh tranh nhau", "D. tiêu diệt nhau"], a: 0 },
    { q: "Câu 37. Tập thể dục buổi sáng ở người để:", o: ["A. nâng cao nhiệt độ", "B. nâng cao sức khỏe", "C. nâng tầm hiểu biết", "D. nâng cao kích thích"], a: 1 },
    { q: "Câu 38. Việc em sẽ làm để bỏ được thói quen ngủ dậy muộn là:", o: ["A. Đặt lịch học", "B. Đặt báo cáo", "C. Đặt báo thức", "D. Đặt thời khóa biểu"], a: 2 },
    { q: "Câu 39. Khi trồng cây thân leo như bầu, bí, mướp,... người trồng thường phải:", o: ["A. làm bù nhìn", "B. làm giàn", "C. phơi khô", "D. làm lạnh"], a: 1 },
    { q: "Câu 40. Muốn tạo được thói quen tập thể dục buổi sáng em cần thực hiện:", o: ["A. luyện tập đều đặn", "B. luyện tập có lệ", "C. luyện tập quá sức", "D. luyện tập hít thở"], a: 0 }
  ];

  const container = document.getElementById('quizContainer');
  let html = '';

  tracnghiem.forEach((item, index) => {
    html += `<div class="question-box" id="tn_box_${index}">
               <div class="question-title">${item.q}</div>
               <div class="options">`;
    item.o.forEach((opt, optIndex) => {
      html += `<label><input type="radio" name="tn_${index}" value="${optIndex}" onclick="chonDapAn(${index})"> <span>${opt}</span></label>`;
    });
    html += `</div><div id="tn_fb_${index}" class="feedback"></div></div>`;
  });

  container.innerHTML = html;

  function chonDapAn(index) {
    playClick();
    document.getElementById(`tn_box_${index}`).classList.add('answered');
    
    let daLam = 0;
    for (let i = 0; i < tracnghiem.length; i++) {
      if (document.querySelector(`input[name="tn_${i}"]:checked`)) {
        daLam++;
      }
    }
    const percent = (daLam / tracnghiem.length) * 100;
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressText').innerText = `Đã làm: ${daLam}/${tracnghiem.length} câu`;
  }

  function nopBai() {
    const ten = document.getElementById('studentName').value;
    if (!ten) {
      playClick();
      alert("⚠️ Vui lòng chọn tên của bạn ở đầu trang trước khi nộp bài!");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    playSubmitSound();
    let diemTN = 0;
    let soCauDung = 0;
    let chualam = 0;

    tracnghiem.forEach((item, index) => {
      const selected = document.querySelector(`input[name="tn_${index}"]:checked`);
      const fb = document.getElementById(`tn_fb_${index}`);
      fb.style.display = 'block';

      if (!selected) {
        chualam++;
        fb.innerHTML = `⚠️ Bạn chưa làm câu này! Đáp án đúng là: <b>${item.o[item.a]}</b>`;
        fb.style.backgroundColor = '#4a3b10';
        fb.style.color = '#ffd54f';
      } else if (parseInt(selected.value) === item.a) {
        diemTN += 0.25; // 40 câu x 0.25 điểm = 10 điểm
        soCauDung++;
        fb.innerHTML = `✔️ Chính xác! Đáp án đúng: <b>${item.o[item.a]}</b>`;
        fb.style.backgroundColor = '#143628';
        fb.style.color = '#6ee7b7';
      } else {
        fb.innerHTML = `❌ Sai rồi! Đáp án đúng là: <b>${item.o[item.a]}</b>`;
        fb.style.backgroundColor = '#451a1a';
        fb.style.color = '#fca5a5';
      }
    });

    let tongDiem = diemTN.toFixed(2).replace(/\.00$/, '');
    let rank = diemTN >= 8 ? "🎉 Xuất sắc! Bạn nắm bài KHTN rất chắc!" : (diemTN >= 5 ? "👍 Khá tốt, xem lại các câu sai để đạt điểm tuyệt đối nhé!" : "📚 Cần ôn kĩ lại đề cương nha!");

    const res = document.getElementById('resultBox');
    res.style.display = 'block';
    res.style.borderColor = diemTN >= 5 ? '#06b6d4' : '#f87171';

    let msg = `<h2 style="color: #fff; margin-top: 0;">KẾT QUẢ BÀI LÀM KHTN 7</h2>
               <b style="font-size: 1.2em;">👤 Học sinh: <span style="color:#22d3ee">${ten}</span></b><br>
               <p style="color:#94a3b8; margin: 5px 0 0 0;">Đúng: <b>${soCauDung}/40</b> câu</p>
               <h1 style="margin: 10px 0 15px 0; color: #22d3ee; font-size: 3.2em;">${tongDiem}<span style="font-size: 0.45em; color: #aaa;">/10 điểm</span></h1>
               <p style="font-size: 1.1em; font-weight: bold;">${rank}</p>`;
               
    if (chualam > 0) {
      msg += `<p style="color:#ffd54f"><i>Lưu ý: Bạn đã bỏ trống ${chualam} câu chưa chọn đáp án.</i></p>`;
    }
    
    msg += `<button onclick="location.reload()" style="background:#22364e; color:#fff; border:1px solid #06b6d4; padding:10px 25px; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">🔄 Làm lại đề</button>`;

    res.innerHTML = msg;
    res.scrollIntoView({ behavior: "smooth" });
  }
</script>
</body>
</html>
